services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: home-library-db

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "HomeLibrary_123!"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HomeLibrary_123!' -C -Q 'SELECT 1' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: home-library-db-init

    depends_on:
      sqlserver:
        condition: service_healthy

    volumes:
      - ./database/init.sql:/scripts/init.sql:ro

    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'HomeLibrary_123!' -C -i /scripts/init.sql

    restart: "no"

volumes:
  sqlserver_data:
